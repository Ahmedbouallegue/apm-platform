# -----------------------------------------------------------------------------
# APM Platform — déploiement type production
# Usage :
#   cp .env.example .env   # SECRET_KEY fort, DEBUG=False, POSTGRES_PASSWORD, …
#   docker compose -f docker-compose.prod.yml up --build -d
# Entrée unique : Nginx (port 80). Postgres / Redis / Gunicorn non exposés.
# -----------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: apm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apm}
      POSTGRES_USER: ${POSTGRES_USER:-apm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apm} -d ${POSTGRES_DB:-apm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apm

  redis:
    image: redis:7-alpine
    container_name: apm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apm

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: apm-platform:prod
    container_name: apm-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      DATABASE_URL: postgres://${POSTGRES_USER:-apm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-apm}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apm

  worker:
    image: apm-platform:prod
    container_name: apm-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-apm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-apm}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    volumes:
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "warning", "--concurrency", "2"]
    networks:
      - apm

  beat:
    image: apm-platform:prod
    container_name: apm-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-apm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-apm}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    command: ["celery", "-A", "config", "beat", "-l", "warning"]
    networks:
      - apm

  nginx:
    image: nginx:1.27-alpine
    container_name: apm-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - apm

networks:
  apm:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
