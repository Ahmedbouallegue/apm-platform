[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "venv",
  "migrations",
  "staticfiles",
  "media",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
