name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/development.txt
            requirements/base.txt

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6,<0.10"

      - name: Ruff lint
        run: ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apm_test
          POSTGRES_USER: apm
          POSTGRES_PASSWORD: apm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apm -d apm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      DATABASE_URL: postgres://apm:apm@localhost:5432/apm_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/development.txt
            requirements/base.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          python -m pytest -q \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker & Nginx
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: apm-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Compose (dev + prod)
        run: |
          docker compose -f docker-compose.yml config --quiet
          POSTGRES_PASSWORD=ci-test docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Nginx config
        run: |
          docker run --rm --add-host=web:127.0.0.1 \
            -v "$PWD/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/docker/nginx/conf.d:/etc/nginx/conf.d:ro" \
            nginx:1.27-alpine nginx -t

      - name: Smoke-test image (Django import)
        run: |
          docker run --rm \
            -e SKIP_DB_WAIT=1 \
            -e RUN_MIGRATIONS=0 \
            -e RUN_COLLECTSTATIC=0 \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            -e SECRET_KEY=ci-image-smoke \
            apm-platform:ci \
            python -c "import django; django.setup(); print('ok', django.get_version())"
