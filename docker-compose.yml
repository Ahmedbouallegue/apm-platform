# -----------------------------------------------------------------------------
# APM Platform — stack locale / développement
# Usage : docker compose up --build -d
# Accès app via Nginx : http://localhost/  (ou WEB_PORT direct)
# -----------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: apm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apm}
      POSTGRES_USER: ${POSTGRES_USER:-apm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apm} -d ${POSTGRES_DB:-apm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apm-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-apm}:${POSTGRES_PASSWORD:-apm}@db:5432/${POSTGRES_DB:-apm}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      SKIP_DB_WAIT: "1"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    # Dev : migrate/collectstatic ici (entrypoint image optionnel si rebuild).
    command:
      - sh
      - -c
      - >-
          python manage.py migrate --noinput &&
          python manage.py collectstatic --noinput &&
          gunicorn config.wsgi:application
          --bind 0.0.0.0:8000
          --workers 3
          --threads 2
          --timeout 60
          --reload


  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apm-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-apm}:${POSTGRES_PASSWORD:-apm}@db:5432/${POSTGRES_DB:-apm}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      SKIP_DB_WAIT: "1"
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info"]

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apm-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-apm}:${POSTGRES_PASSWORD:-apm}@db:5432/${POSTGRES_DB:-apm}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      SKIP_DB_WAIT: "1"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  nginx:
    image: nginx:1.27-alpine
    container_name: apm-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: apm-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - web

  grafana:
    image: grafana/grafana:11.2.0
    container_name: apm-grafana
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  prometheus_data:
  grafana_data:
